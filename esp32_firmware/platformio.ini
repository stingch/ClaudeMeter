; ClaudeMeter ESP32 韌體 - PlatformIO 專案設定
;
; 為什麼用 PlatformIO 而不是 Arduino IDE：
; TFT_eSPI 預設要求使用者去修改函式庫資料夾內的 User_Setup.h 才能設定螢幕腳位，
; 這代表每個 clone 這個 repo 的人都要手動找到 Arduino libraries 資料夾、編輯別人的原始碼，
; 而且如果電腦上還有其他專案也用 TFT_eSPI，設定會互相覆蓋。
;
; PlatformIO 允許透過下面的 build_flags（編譯期巨集）把腳位設定直接注入 TFT_eSPI，
; 完全不需要碰函式庫本身的檔案，設定也隨 repo 一起版本控制。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    ; ---- 告訴 TFT_eSPI 不要去讀函式庫內建的 User_Setup.h，改用下面的巨集 ----
    -DUSER_SETUP_LOADED=1

    ; ---- 面板驅動晶片與解析度 (2.2" SPI TFT, ILI9341) ----
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; ---- 腳位對應 (對照 README 的接線表) ----
    ; MISO 未接線 (螢幕為單向顯示，不需要讀取)，故不定義 TFT_MISO
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    ; ---- 字型 (renderUI() 用到 setTextFont(2) 與 setTextFont(4)) ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    -DSPI_FREQUENCY=40000000
